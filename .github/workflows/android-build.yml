
name: Build Shahriyati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Shahriyati_Android_Project.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip Shahriyati_Android_Project.zip
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/Shahriyati_Android_Project" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Shahriyati-APK
          path: Shahriyati_Android_Project/app/build/outputs/apk/debug/app-debug.apk
